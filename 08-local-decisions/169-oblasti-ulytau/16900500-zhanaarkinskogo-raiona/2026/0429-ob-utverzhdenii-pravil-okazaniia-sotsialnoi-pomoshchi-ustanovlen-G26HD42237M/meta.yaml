    kaz: Жаңаарқа ауданының мәслихатының 2026 жылғы 29 сәуірдегі № 42/237 «Жаңаарқа ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
