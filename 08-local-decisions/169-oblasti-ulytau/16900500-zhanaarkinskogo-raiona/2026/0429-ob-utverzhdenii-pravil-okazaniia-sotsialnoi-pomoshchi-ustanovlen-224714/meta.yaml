  title:
    rus: О внесении изменений в решение Жанааркинского районного маслихата от 29 апреля 2026 года № 42/237 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жанааркинского района»
