act_code: '205532'
requisite: Решение Жанааркинского районного маслихата области Ұлытау от 26 декабря 2024 года № 24/152
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов, сел, поселков, сельских округов (за исключением лиц, занимающих руководящие должности), прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, (басшы лауазымдарды атқаратын адамдарды қоспағанда) 2025 жылы әлеуметтік қолдау шараларын беру туралы
