act_code: '220292'
requisite: Решение Жанааркинского районного маслихата области Ұлытау от 25 декабря 2025 года № 36/207
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов, сел, поселков, сельских округов (за исключением лиц, занимающих руководящие должности), прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елдімекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтерәкімдері аппараттарыны мемлекеттік қызметшілеріне, басшы лауазымдардыатқаратын адамдарды қоспағанда 2026 жылы әлеуметтік қолдау шараларын беру туралы
