act_code: '191071'
requisite: Решение Каражалского городского маслихата области Ұлытау от 27 декабря 2023 года № 100. Зарегистрировано в Департаменте юстиции области Ұлытау 28 декабря 2023 года № 84-20
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Каражал
  kaz: Қаражал қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы
