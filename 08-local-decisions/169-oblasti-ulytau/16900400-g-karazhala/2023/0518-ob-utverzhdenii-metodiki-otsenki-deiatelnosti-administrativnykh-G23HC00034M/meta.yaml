  title:
    rus: О признании утратившим силу решения Каражалского городского маслихата от 18 мая марта 2023 года № 34 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Каражалского городского маслихата» и «О внесении изменений в решение Каражалского городского маслихата от 18 мая 2023 года № 34 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Каражалского городского маслихата» от 8 ноября 2023 года № 84
    kaz: Қаражал қалалық мәслихатының «Қаражал қалалық мәслихат аппараты» мемлекеттік мекемесінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» 2023 жылғы 18 мамырдағы № 34 және «Қаражал қалалық мәслихатының 2023 жылғы 18 мамырдағы № 34 «Қаражал қалалық мәслихат аппараты» мемлекеттік мекемесінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы» 2023 жылғы 8 қарашадағы № 84 шешімдерінің күші жойылды деп тану туралы
