act_code: '222405'
requisite: Решение Улытауского районного маслихата области Ұлытау от 23 февраля 2026 года № 264
title:
  rus: О предоставлении в 2026 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов (за исключением лиц, занимающих руководящие должности), прибывшим для работы и проживания в сельские населенные пункты Улытауского района
  kaz: Ұлытау ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, басшы лауазымдарды атқаратын адамдарды қоспағанда 2026 жылы әлеуметтік қолдау шараларын беру туралы
