requisite: Решение Улытауского районного маслихата области Ұлытау от 27 декабря 2023 года № 82. Зарегистрировано в Департаменте юстиции области Ұлытау 29 декабря 2023 года № 85-20
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Улытауском районе
  kaz: Ұлытау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы
