  title:
    rus: О внесении изменения в решение Сатпаевского городского маслихата от 25 мая 2026 года № 280 «Об утверждении Правила оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Сатпаев»
    kaz: Сәтбаев қалалық мәслихатының 2026 жылғы 25 мамырдағы № 280 «Сәтбаев қаласының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау  қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
