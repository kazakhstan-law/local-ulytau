requisite: Решение маслихата области Ұлытау от 6 октября 2023 года № 6/69. Зарегистрировано в Департаменте юстиции области Ұлытау 16 октября 2023 года № 58-20
title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселках, городах районного и областного значения области Ұлытау, а также порядка и размера оказания им социальной поддержки за счет бюджетных средств
  kaz: Ұлытау облысының ауылдық жерге және кенттерге, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы
