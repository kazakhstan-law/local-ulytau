title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно
  kaz: Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды қосымша беру туралы
