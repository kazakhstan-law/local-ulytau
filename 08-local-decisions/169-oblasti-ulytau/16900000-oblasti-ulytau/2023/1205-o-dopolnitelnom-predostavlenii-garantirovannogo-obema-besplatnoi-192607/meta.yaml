  title:
    rus: О внесении изменения в решение VIII сессии маслихата области Ұлытау от 5 декабря 2023 года № 92 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно»
    kaz: Ұлытау облыстық мәслихатының VIII сессиясының 2023 жылғы 5 желтоқсандағы № 92 «Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды қосымша беру туралы» шешіміне өзгеріс енгізу туралы
