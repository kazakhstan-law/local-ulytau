act_code: '200854'
requisite: Решение маслихата области Ұлытау от 18 сентября 2024 года № 19/169. Зарегистрировано в Департаменте юстиции области Ұлытау 23 сентября 2024 года № 147-20
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, зарегистрированным в области Ұлытау, за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Ұлытау облысында тіркелген Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
