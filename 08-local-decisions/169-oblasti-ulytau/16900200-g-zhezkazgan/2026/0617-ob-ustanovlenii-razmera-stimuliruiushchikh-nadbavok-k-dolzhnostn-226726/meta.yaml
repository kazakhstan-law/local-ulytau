title:
  rus: Об установлении размера стимулирующих надбавок к должностным окладам работников коммунального государственного казенного предприятия «Управление парками культуры и отдыха» государственного учреждения «Отдел жилищно-коммунального хозяйства города Жезказган», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Жезқазған қаласы тұрғын үй және коммуналдық шаруашылық бөлімі» мемлекеттік мекемесінің «Мәдениет және демалыс саябақтарын басқару» коммуналдық мемлекеттік кәсіпорны қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемақы мөлшерін белгілеу туралы
