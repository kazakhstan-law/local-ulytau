  title:
    rus: О внесении изменений в решение Жезказганского городского маслихата от 13 февраля 2024 года № 15/82 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Жезказган»
    kaz: Жезқазған қалалық мәслихатының 2024 жылғы 13 ақпандағы № 15/82 «Жезқазған қаласының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
